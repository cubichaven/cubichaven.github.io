<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubic Haven | Low-Poly 3D Asset Packs</title>
    <style>
        :root {
            --bg-color: #1E241E;
            --text-color: #E2E8E2;
            --accent-color: #7FA96B;
            --card-bg: #273027;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1rem 1rem;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 2rem 0;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(127, 169, 107, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .btn {
            background-color: var(--accent-color);
            color: #1E241E;
            padding: 0.8rem 1.8rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #98c283;
            transform: translateY(-2px);
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cubic Haven</h1>
        <p class="subtitle">Stylized low-poly 3D asset packs designed for game developers.</p>
    </header>

    <div class="container">
        <div class="product-card">
            <h2>Medieval Wooden Structures</h2>
            <p>9 low-poly wooden buildings and props designed to build vibrant rustic settlements with ease.</p>
            <a href="https://itch.io" target="_blank" class="btn">View on itch.io</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Cubic Haven. All rights reserved.</p>
    </footer>

</body>
</html>
